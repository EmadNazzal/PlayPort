services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: playport
      POSTGRES_PASSWORD: playport
      POSTGRES_DB: playport
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U playport']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
